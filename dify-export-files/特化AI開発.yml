            生成するコードは 単一ファイルで完結 させること。

            config.json など、外部の設定ファイルに依存してはいけない。

            competition_dir 直下にある train.csv / test.csv / sample_submission.csv などを

            コード内で自分で探して読み込むこと。

            入口となる関数は必ず

            def run_ai(competition_dir: str, output_dir: str):

            の形で定義すること。

            Python コードのみを出力し、python や などの Markdown 記号は出力しないこと。'
