        - id: e18231fd-85e9-4bd3-8f2b-b2f54e31390a
          role: user
          text: '入出力仕様（あれば遵守）：

            {{#1765364715941.io_spec#}}

            失敗したコード：

            {{#1765364715941.ai_code#}}

            実行エラー全文：

            {{#1765364715941.error_text#}}


            要件：

            - エラー原因を特定し、最小の修正で動くように直してください。

            - 省略は禁止（… や “以下略” は禁止）。完全なコード全文を返してください。

            - 追加インストールが必要ならコード先頭に `!pip -q install ...` を含めてください。


            出力形式（厳守・この順番で）：

            [FIXED_CODE]

            （ここに修正版コード全文。``` や説明文は禁止）

            [/FIXED_CODE]


            [SUMMARY]

            （何を直したかを1〜5行）

            [/SUMMARY]


            [ASSUMPTIONS]

            （前提があれば箇条書き。なければ "NONE"）

            [/ASSUMPTIONS]


            [NEXT_IF_FAILS]

            （まだ失敗する場合に追加で欲しい情報や次の確認点）

            [/NEXT_IF_FAILS]'
